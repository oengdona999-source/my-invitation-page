<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gold sparkle overlay</title><style>
*{box-sizing:border-box}body{margin:0;background:#111;color:#f7ead0;font:16px system-ui;text-align:center}.wrap{max-width:460px;margin:auto;padding:16px}.stage{width:min(100%,360px);aspect-ratio:9/16;margin:12px auto;background:#050505;box-shadow:0 0 32px #000;border:1px solid #55462f}canvas{width:100%;height:100%;display:block}h1{font-size:21px;margin:6px}p{font-size:14px;color:#c8bda9;line-height:1.5}button{border:0;border-radius:8px;background:#d5a84c;color:#17120a;font-weight:700;padding:12px 18px;font-size:15px;cursor:pointer}button:disabled{opacity:.55}.hint{font-size:12px;color:#a99b83}
</style></head><body><main class="wrap"><h1>Golden twinkle overlay</h1><p>Vertical 9:16 • 16-second loop • black background for Screen blend</p><div class="stage"><canvas id="c" width="540" height="960"></canvas></div><button id="save">Record &amp; download 16s overlay</button><p class="hint" id="msg">Import the downloaded WebM above your clip in CapCut, then choose Blend → Screen.</p></main><script>
const c=document.querySelector('#c'),x=c.getContext('2d'),W=c.width,H=c.height,N=105,seed=4711;let s=seed;function rnd(){s=(s*1664525+1013904223)>>>0;return s/4294967296}const stars=Array.from({length:N},(_,i)=>({x:rnd()*W,y:rnd()*H,r:1+rnd()*2.3,phase:rnd()*6.28,speed:.7+rnd()*1.7,gold:rnd()>.36,flare:rnd()>.79,drift:(rnd()-.5)*5}));
function draw(t){x.fillStyle='#000';x.fillRect(0,0,W,H);for(const a of stars){let wave=(Math.sin(t*a.speed+a.phase)+1)/2,alpha=.14+wave*.78,yy=(a.y+t*a.drift)%H;if(yy<0)yy+=H;x.save();x.globalAlpha=alpha;x.shadowBlur=a.flare?16:7;x.shadowColor=a.gold?'#ffd774':'#fff7dc';x.fillStyle=a.gold?'#ffdf83':'#fff8e9';x.beginPath();x.arc(a.x,yy,a.r*(.55+wave*.65),0,Math.PI*2);x.fill();if(a.flare&&wave>.69){let q=(wave-.69)/.31, len=(5+q*13);x.globalAlpha=alpha*q*.82;x.strokeStyle=a.gold?'#ffe49c':'#ffffff';x.lineWidth=1.2;x.beginPath();x.moveTo(a.x-len,yy);x.lineTo(a.x+len,yy);x.moveTo(a.x,yy-len);x.lineTo(a.x,yy+len);x.stroke();x.beginPath();x.arc(a.x,yy,2+q*2,0,Math.PI*2);x.fill()};x.restore()}}
let start=performance.now();function animate(now){draw((now-start)/1000);requestAnimationFrame(animate)}requestAnimationFrame(animate);
document.querySelector('#save').onclick=async()=>{let b=document.querySelector('#save'),m=document.querySelector('#msg');if(!c.captureStream||!window.MediaRecorder){m.textContent='Recording is not supported in this browser. Open this file in Chrome or Edge.';return}b.disabled=true;m.textContent='Recording sparkle loop…';const stream=c.captureStream(30);let mime=MediaRecorder.isTypeSupported('video/webm;codecs=vp9')?'video/webm;codecs=vp9':'video/webm';let rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:5000000}),chunks=[];rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};rec.onstop=()=>{let url=URL.createObjectURL(new Blob(chunks,{type:'video/webm'})),a=document.createElement('a');a.href=url;a.download='golden-twinkle-overlay-16s.webm';a.click();setTimeout(()=>URL.revokeObjectURL(url),30000);b.disabled=false;m.textContent='Saved. In CapCut place the WebM above your clip and choose Blend → Screen.'};rec.start();let t0=performance.now();function capture(now){draw((now-start)/1000);if(now-t0<16000)requestAnimationFrame(capture);else rec.stop()}requestAnimationFrame(capture)};
</script></body></html>
